<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Meme generator</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/logo.svg" alt="logo" width="50" height="50">
    <ul class="main-list">
        <li class="list__item">
          <a href="">Pagina principale</a>
        </li>
        <li class="list__item">
          <a href="">Collezione</a>
        </li>
        <li class="list__item">
          <a href="">Feedback</a>
        </li>
    </ul>
  </header>
  <main>
    {% block content %}
    <div class="form-block">
      <h1>Genera il tuo meme!</h1>
      <form method="POST" action="{{ url_for('index') }}">
        <ul class="form-list">
          <li class="form-list_item">
            <label for="image-selector">Seleziona un meme</label>
            <select name="image-selector" id="image-selector">
              <option value="logo.svg" {% if selected_image == 'logo.svg' %}selected{% endif %}>Seleziona un meme</option>
              <option value="meme_1.jpg" {% if selected_image == 'meme_1.jpg' %}selected{% endif %}>Ragazza disastrosa</option>
              <option value="meme_2.jpg" {% if selected_image == 'meme_2.jpg' %}selected{% endif %}>Due pulsanti</option>
              <!--Consegna #1. Aggiungere nuovi meme qui -->
              <option value="meme_3.jpg" {% if selected_image == 'meme_3.jpg' %}selected{% endif %}>Drake</option>
              <option value="meme_4.jpg" {% if selected_image == 'meme_4.jpg' %}selected{% endif %}>Distracted Boyfriend</option>
              <option value="meme_5.jpg" {% if selected_image == 'meme_5.jpg' %}selected{% endif %}>Gru</option>
              <option value="meme_6.jpg" {% if selected_image == 'meme_6.jpg' %}selected{% endif %}>Leonardo DiCaprio Cheers</option>
              <option value="meme_7.jpg" {% if selected_image == 'meme_7.jpg' %}selected{% endif %}>Success Kid</option>
            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop">Inserire qui il testo superiore</label>
            <input class="input_text" type="text" placeholder="Testo superiore" name="textTop">
          </li>
          <li class="form-list_item">
            <label for="textBottom">Inserire qui il testo inferiore</label>
            <input class="input_text" type="text" placeholder="Testo inferiore" name="textBottom">
          </li>
          <li class="form-list_item">
            <label for="color-selector">Impostare il colore del testo</label>
            <select name="color-selector" id="color-selector">
              <option value="white" {% if selected_color == 'white' %}selected{% endif %}>Bianco</option>
              <option value="black" {% if selected_color == 'black' %}selected{% endif %}>Nero</option>
              <!--Consegna aggiuntiva #1. Aggiungere nuovi colori qui -->
              <option value="red" {% if selected_color == 'red' %}selected{% endif %}>Rosso</option>
              <option value="blue" {% if selected_color == 'blue' %}selected{% endif %}>Blu</option>
              <option value="green" {% if selected_color == 'green' %}selected{% endif %}>Verde</option>
              <option value="yellow" {% if selected_color == 'yellow' %}selected{% endif %}>Giallo</option>
              <option value="purple" {% if selected_color == 'purple' %}selected{% endif %}>Viola</option>
              <option value="orange" {% if selected_color == 'orange' %}selected{% endif %}>Arancione</option>
              <option value="pink" {% if selected_color == 'pink' %}selected{% endif %}>Rosa</option>
              <option value="brown" {% if selected_color == 'brown' %}selected{% endif %}>Marrone</option>
              <option value="gray" {% if selected_color == 'gray' %}selected{% endif %}>Grigio</option>
              <option value="cyan" {% if selected_color == 'cyan' %}selected{% endif %}>Ciano</option>
              <option value="magenta" {% if selected_color == 'magenta' %}selected{% endif %}>Magenta</option>
              <option value="lime" {% if selected_color == 'lime' %}selected{% endif %}>Lime</option>
              <option value="teal" {% if selected_color == 'teal' %}selected{% endif %}>Teal</option>
              <option value="navy" {% if selected_color == 'navy' %}selected{% endif %}>Navy</option>
              <option value="maroon" {% if selected_color == 'maroon' %}selected{% endif %}>Marrone scuro</option>
              <option value="olive" {% if selected_color == 'olive' %}selected{% endif %}>Oliva</option>
              <option value="silver" {% if selected_color == 'silver' %}selected{% endif %}>Argento</option>
              <option value="gold" {% if selected_color == 'gold' %}selected{% endif %}>Oro</option>
              <option value="beige" {% if selected_color == 'beige' %}selected{% endif %}>Beige</option>
              <option value="coral" {% if selected_color == 'coral' %}selected{% endif %}>Corallo</option>

            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop_y">Inserire il posizionamento del testo superiore sull'asse Y</label>
            <input class="input_text" id="textTop_y" type="text" placeholder="Testo superiore" name="textTop_y">
          </li>
          <li class="form-list_item">
            <label for="textBottom_y">Inserire il posizionamento del testo inferiore sull'asse Y</label>
            <input class="input_text" id="textBottom_y" type="text" placeholder="Testo inferiore" name="textBottom_y">
          </li>
          <button type="submit">Crea il meme</button>
        </ul>
      </form>
    </div>
    <div class="meme-block" id="memeBlock">
      
      <p class="text_top" style="color: {{colore_selezionato}}; top: {{testo_sopra_y}}px;">
        <!-- Consegna #2. Inserire la variabile con il testo -->
        {{ testo_sopra }}
      </p>

      <img class="meme" src="{{ url_for('serve_images', path=selected_image) }}" alt="{{ selected_image }}">

      <p class="text_bottom" style="color: {{colore_selezionato}}; top: {{testo_sotto_y}}px;">
        <!-- Consegna #2. Inserire la variabile con il testo -->
        {{ testo_sotto }}
      </p>

    </div>


    {% endblock %}
  </main>
  <footer>

  </footer>
</body>
</html>
